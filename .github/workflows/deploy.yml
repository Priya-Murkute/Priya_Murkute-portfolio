name: Deploy to GitHub Pages

# Alternative to Vercel — see README.md "Deploy" for when to use which.
# Vercel deploys automatically on push once the repo is imported there and
# needs no workflow file. Use this workflow only if you're serving the site
# from https://<user>.github.io/priya-portfolio/ instead.
#
# Actions are pinned to a commit, not a tag (see ci.yml for why).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the one job that publishes asks for more below.
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Pushing the built site to the gh-pages branch is the only write this workflow makes.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          GITHUB_PAGES: "true"

      # GitHub Pages has no server-side rewrite, so a direct load of a
      # client-side route (e.g. /off-hours) 404s. Serving index.html as the
      # 404 page is the standard SPA workaround: the browser still gets a 200
      # for "/", and any deep link falls through to this copy, which boots
      # the app and lets react-router take over.
      - run: cp dist/index.html dist/404.html

      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
