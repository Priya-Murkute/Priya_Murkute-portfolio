# Weekly pull requests for out-of-date dependencies — including the commit pins
# in .github/workflows, which don't update themselves.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # eslint-plugin-jsx-a11y caps its peer at eslint ^9, so an eslint major bump
    # fails `npm ci` on Vercel with ERESOLVE. Hold eslint at 9.x until the plugin
    # declares support for the next major.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR for the routine dev-tool bumps rather than a dozen.
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
