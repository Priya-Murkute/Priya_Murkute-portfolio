    <!--
      Applies the stored theme before first paint; ThemeProvider's effect only
      runs after React mounts, which is a white flash for dark-mode visitors.
      The key and colours are duplicated from src/context/ThemeContext.tsx
      because this runs before any module loads — keep the two in step.
    -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("pm-theme") === "dark") {
            document.documentElement.classList.add("dark");
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", "#0e1113");
          }
        } catch (e) {
          /* storage unavailable */
        }
      })();
    </script>
