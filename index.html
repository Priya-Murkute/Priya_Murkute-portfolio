<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Priya Murkute — QA Automation Engineer</title>
    <meta
      name="description"
      content="Priya Murkute, QA automation engineer in the UK. Three years automating test coverage for banking platforms at Wipro, then an MSc in Computer Science while working as a London-based SDET. REST Assured and Selenium frameworks wired into CI."
    />
    <meta name="theme-color" content="#fafaf7" />
    <link rel="canonical" href="https://priya-murkute-portfolio.vercel.app/" />

    <!-- A green "pass" dot, matching the site's own vocabulary. Inline SVG so
         there's no extra request and it works in both themes. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%232e6b4f'/%3E%3C/svg%3E"
    />

    <!-- Social preview. Without these a pasted link renders as a bare grey
         box on LinkedIn and Slack, which is where a portfolio actually gets
         shared. og-image.png is generated by scripts/generate-og-image.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Priya Murkute" />
    <meta property="og:title" content="Priya Murkute — QA Automation Engineer" />
    <meta
      property="og:description"
      content="Three years automating test coverage for banking platforms, then an MSc in Computer Science while working as a London-based SDET. Frameworks built to be inherited."
    />
    <meta property="og:url" content="https://priya-murkute-portfolio.vercel.app/" />
    <meta property="og:image" content="https://priya-murkute-portfolio.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Priya Murkute, QA Automation Engineer, United Kingdom" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Priya Murkute — QA Automation Engineer" />
    <meta
      name="twitter:description"
      content="QA and SDET work: API frameworks wired into CI, Selenium and WebdriverIO automation, BDD adoption at 300+ scenarios."
    />
    <meta name="twitter:image" content="https://priya-murkute-portfolio.vercel.app/og-image.png" />

    <!-- Structured data, so a search result can show the role and location
         rather than guessing them out of the page copy. Kept in step with
         src/data/resume.ts by hand — it's the one place those facts are
         duplicated outside the app. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Priya Murkute",
        "jobTitle": "QA Automation Engineer",
        "email": "mailto:priyamurkute7@gmail.com",
        "url": "https://priya-murkute-portfolio.vercel.app/",
        "address": { "@type": "PostalAddress", "addressCountry": "GB" },
        "sameAs": [
          "https://github.com/Priya-Murkute",
          "https://www.linkedin.com/in/priya-murkute-oct7"
        ],
        "alumniOf": [
          { "@type": "CollegeOrUniversity", "name": "Queen Mary University of London" },
          { "@type": "CollegeOrUniversity", "name": "R. H. Sapat College of Engineering, Nashik" }
        ],
        "knowsAbout": [
          "Test automation",
          "Selenium WebDriver",
          "WebdriverIO",
          "REST Assured",
          "Postman",
          "Cucumber",
          "BDD",
          "CI/CD"
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      Applies the stored theme before the first paint. ThemeProvider does the
      same thing, but from a useEffect — which runs after React mounts, which
      is after the browser has already painted a light page. Without this, a
      returning dark-mode visitor sees a white flash on every load.

      The storage key and the two theme-color values are duplicated from
      src/context/ThemeContext.tsx on purpose: this has to run before any
      module loads, so it cannot import them. Keep the two in step.
    -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("pm-theme") === "dark") {
            document.documentElement.classList.add("dark");
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", "#0e1113");
          }
        } catch (e) {
          /* localStorage unavailable (private browsing) — fall through to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
